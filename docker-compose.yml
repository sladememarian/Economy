services:
  mongodb:
    image: mongo:7
    container_name: economy-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # the bot waits for this before it starts polling
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    build: .
    container_name: economy-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # inside the network mongo is reachable by service name
      MONGO_URI: mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
